<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Oxide</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      background: #121418;
      color: #e6ebf0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #00d2ff;
      letter-spacing: 0.5px;
    }
    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      background: rgba(0, 210, 255, 0.15);
      color: #00d2ff;
      border-radius: 12px;
    }
    .info {
      font-size: 12px;
      color: #8c96a0;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 8px 0;
      background: #00d2ff;
      color: #121418;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover {
      background: #33dcff;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">OXIDE</div>
    <div class="status-badge" id="daemon-status">Connected</div>
  </div>
  <div class="info">
    Dynamic multi-segment downloading and browser interception active.
  </div>
  <button class="btn" id="open-app-btn">Open Oxide Manager</button>
  <script src="popup.js"></script>
</body>
</html>

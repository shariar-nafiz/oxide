name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: oxide-dl-linux-x86_64.tar.gz
            use_cross: false

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: oxide-dl-windows-x86_64.zip
            use_cross: false

          # macOS Universal (Intel & Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: oxide-dl-macos-arm64.tar.gz
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} -p oxide-cli -p oxide-gui -p oxide-nmh

      - name: Package artifacts (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/oxide-dl dist/
          cp target/${{ matrix.target }}/release/oxide-cli dist/
          cp target/${{ matrix.target }}/release/oxide-nmh dist/
          tar -czvf ${{ matrix.artifact_name }} -C dist .

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/oxide-dl.exe dist/
          cp target/${{ matrix.target }}/release/oxide-cli.exe dist/
          cp target/${{ matrix.target }}/release/oxide-nmh.exe dist/
          cd dist && 7z a ../${{ matrix.artifact_name }} *

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}

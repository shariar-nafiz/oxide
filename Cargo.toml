[workspace]
resolver = "2"
members = [
    "crates/oxide-core",
    "crates/oxide-os",
    "crates/oxide-stream",
    "crates/oxide-spider",
    "crates/oxide-torrent",
    "crates/oxide-ipc",
    "crates/oxide-nmh",
    "crates/oxide-cli",
    "crates/oxide-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Oxide Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/shariarunix/oxide-dl"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
bytes = "1.7"
directories = "5.0"
redb = "2.1"
parking_lot = "0.12"
async-trait = "0.1"
interprocess = { version = "2.2", features = ["tokio"] }

# Size, memory and link-time optimizations
[profile.release]
opt-level = "z"       # Optimize for small binary size
lto = "fat"           # Full cross-crate link time optimization
codegen-units = 1     # Maximize dead-code elimination & inlining
panic = "abort"       # Strip unwinding tables
strip = "symbols"     # Automatically strip debug symbols

[profile.release-fast]
inherits = "release"
opt-level = 3         # Max speed variant for high-throughput benchmarks
